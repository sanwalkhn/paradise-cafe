name: paradise_cafe
description: Paradise Cafe fast food ordering app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI & fonts ─────────────────────────────────
  google_fonts: ^6.2.0
  iconsax: ^0.0.8
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # ── Navigation ─────────────────────────────────
  go_router: ^13.2.0

  # ── State management ───────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Firebase ───────────────────────────────────
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.15

  # ── Local storage ──────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ── Data & networking ──────────────────────────
  json_annotation: ^4.8.1
  dio: ^5.4.1
  connectivity_plus: ^6.0.3

  # ── Maps & location ────────────────────────────
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # ── Utilities ──────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  flutter_svg: ^2.0.9

  # ── Payments ───────────────────────────────────
  flutter_stripe: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_512.png"
  min_sdk_android: 21